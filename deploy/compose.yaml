# Local stack (spec 13). Services are added as the processes that need them are built.
name: webhook-relay

services:
  postgres:
    image: postgres:18.6-alpine # DEP-20: pinned
    command: ['postgres', '-c', 'max_connections=200'] # DEP-24 / RES-07
    environment:
      POSTGRES_USER: whr
      POSTGRES_PASSWORD: whr
      POSTGRES_DB: whr
    ports:
      - '5432:5432' # dev only (SEC-40)
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U whr -d whr']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
